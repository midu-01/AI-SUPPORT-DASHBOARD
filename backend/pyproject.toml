[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-dashboard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # [asyncio] pulls in greenlet, which the async engine needs at runtime.
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pydantic[email]>=2.7.0",
    # bcrypt directly, not passlib: passlib 1.7.4 (2020) is unmaintained and
    # crashes against bcrypt >= 4.1, which every fresh install now resolves to.
    "bcrypt>=4.1",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    # Used directly for non-blocking file writes on upload.
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

# Only `app` is an installable package. Without this, setuptools' flat-layout
# autodiscovery also picks up `alembic` and `tests` and refuses to build.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures and tests must share one event loop. With the default (function)
# scope, a session-scoped async fixture builds its connections on a loop that is
# already closed by the time a test runs, which asyncpg reports as the very
# confusing "another operation is in progress".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
